let data;try{data=JSON.parse(localStorage.getItem('givingUnifiedDemoV1'))||structuredClone(seed)}catch{data=structuredClone(seed)};let page='home',step=0,form=blank(),files=[],activeCase=1,activeReviewer=1,activeJudge=5,selectedReviewCase=1,draftScores=[3,3,3,3,3,3],newUser={name:'',email:'',role:'مقيم',sector:'جمعية أهلية'},selectedReviewers=[],selectedJudges=[],message='';
const persist=()=>{try{localStorage.setItem('givingUnifiedDemoV1',JSON.stringify(data))}catch{}},caseBy=id=>data.cases.find(c=>c.id===Number(id)),userBy=id=>data.users.find(u=>u.id===Number(id)),rated=c=>c.assigned.filter(id=>Array.isArray(c.ratings[id])),score=a=>Math.round(a.reduce((s,v,i)=>s+v*criteria[i][1]/5,0)*100)/100,average=c=>c.assigned.length===3&&rated(c).length===3?Math.round(rated(c).reduce((s,id)=>s+score(c.ratings[id]),0)/3*100)/100:null,gov=c=>c.govUnavailable?'لا يوجد تقييم':c.govScore!==''?c.govScore+'%':'غير مدخلة',opt=(arr,v)=>arr.map(x=>`<option value="${E(x.value??x)}" ${String(x.value??x)===String(v)?'selected':''}>${E(x.label??x)}</option>`).join(''),head=(t,s)=>`<h2>${t}</h2><p class="muted">${s}</p>`,field=(label,key,placeholder='',type='text')=>`<label class="field">${label}<input type="${type}" data-form="${key}" value="${E(form[key])}" placeholder="${E(placeholder)}"></label>`,row=(a,b)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #edf1f5;font-size:13px"><span class="muted">${E(a)}</span><strong>${E(b||'غير مدخل')}</strong></div>`;

if(page==='home'){h+=head('مرحباً بك في منصة العطاء','نظام موحد للترشح والحوكمة والأدلة والتقييم والتحكيم');h+=`<div class="stats" style="margin:18px 0">${[['الطلبات',data.cases.length],['المقيمون',data.users.filter(u=>u.role==='مقيم').length],['المحكمون',data.users.filter(u=>u.role==='محكم').length],['متوسطات مكتملة',data.cases.filter(c=>average(c)!==null).length]].map(([t,n])=>`<div class="stat"><strong>${n}</strong><span class="muted">${t}</span></div>`).join('')}</div>`;h+=`<div class="panel"><h3>رحلة الترشح</h3><p class="muted">بيانات الجهة ← الحوكمة ← اختيار المسار ← الإنجاز وملفات PDF ← إرسال الطلب ← إسناده إلى ثلاثة مقيمين مستقلين ← المتوسط الحسابي ← التحكيم.</p><button class="btn" data-page="apply">إنشاء طلب جديد</button></div><div class="panel"><h3>التجربة حسب الدور</h3><div class="grid"><button class="btn secondary" data-page="accounts">إنشاء حسابات</button><button class="btn secondary" data-page="review">تجربة بوابة المقيم</button><button class="btn secondary" data-page="judge">تجربة بوابة المحكم</button><button class="btn secondary" data-page="results">عرض المتوسطات</button></div></div>`}

if(step===2){h+=`<h3>الإنجاز والأدلة</h3>${field('عنوان الإنجاز','title','اسم المبادرة')}<label class="field">وصف الإنجاز<textarea data-form="description" rows="3">${E(form.description)}</textarea></label><label class="field">النتائج والأثر<textarea data-form="results" rows="2">${E(form.results)}</textarea></label><label class="field">وصف الأدلة<textarea data-form="evidence" rows="2">${E(form.evidence)}</textarea></label><h3>📎 رفع مستندات PDF</h3><label class="drop" for="pdf-files"><div style="font-size:28px">📤</div><strong>اضغط لاختيار ملفات PDF</strong><div class="muted">حتى 10 ملفات · 10 ميجابايت لكل ملف</div></label><input id="pdf-files" type="file" accept=".pdf,application/pdf" multiple hidden><div id="file-list">${files.map((f,i)=>`<div class="file"><div>📄 <strong class="mini">${E(f.name)}</strong><div class="muted">${(f.size/1048576).toFixed(2)} MB</div></div><div><button class="btn secondary" data-preview="${i}">عرض</button> <button class="btn secondary" data-remove="${i}">حذف</button></div></div>`).join('')}</div><p class="muted">${files.length} من 10 ملفات · ملفات PDF مختارة محلياً؛ لا تُرفع إلى خادم.</p>`}

if(page==='requests'){h+=head('طلبات الترشح','ملفات الجهات وبيانات الحوكمة والأدلة المرفقة');h+=`<div class="panel tablewrap"><table><thead><tr><th>رقم الطلب</th><th>الجهة</th><th>المسار</th><th>الحوكمة</th><th>PDF</th><th>الحالة</th></tr></thead><tbody>${data.cases.map(c=>`<tr><td>AT-${String(c.id).padStart(4,'0')}</td><td>${E(c.name)}</td><td>${E(c.track)}</td><td>${E(gov(c))}</td><td>${c.files.length}</td><td><span class="pill">${E(c.status)}</span></td></tr>`).join('')}</tbody></table></div>`}

if(page==='review'){let mine=data.cases.filter(c=>c.assigned.includes(activeReviewer)),c=caseBy(selectedReviewCase);h+=head('بوابة المقيم','عرض الملفات المسندة فقط، دون تقييمات الزملاء');h+=`<div class="panel"><label class="field">محاكاة هوية المقيم<select id="reviewer-id">${opt(data.users.filter(u=>u.role==='مقيم').map(u=>({value:u.id,label:u.name+' — '+u.sector})),activeReviewer)}</select></label><div class="warning">اختيار الحساب للتجربة فقط. النسخة التشغيلية تحتاج تسجيل دخول حقيقياً وفحص الصلاحيات على الخادم.</div></div><div class="panel"><h3>ملفاتي (${mine.length})</h3>${mine.map(x=>`<button class="btn ${x.id===selectedReviewCase?'':'secondary'}" style="margin:3px" data-review-case="${x.id}">${E(x.title)}</button>`).join('')||'<p class="muted">لا توجد ملفات مسندة.</p>'}</div>`;if(c&&c.assigned.includes(activeReviewer)){h+=`<div class="panel"><h3>${E(c.title)}</h3>${row('الجهة',c.name)}${row('المسار',c.track)}${row('درجة الحوكمة',gov(c))}${row('جهة إصدار الحوكمة',c.govIssuer)}<p class="mini">${E(c.description)}</p><h3 style="margin-top:18px">مستندات الأدلة</h3>${c.files.length?c.files.map(f=>`<div class="file"><span>📄 ${E(f.name)}</span><span class="muted">بيانات وصفية تجريبية</span></div>`).join(''):'<p class="muted">لا توجد ملفات PDF محفوظة في هذا النموذج. يلزم تخزين خادمي لعرض المحتوى بعد الإرسال.</p>'}<h3 style="margin-top:18px">تقييم المعايير</h3>${criteria.map(([name,w],i)=>`<div class="criteria"><div class="row mini"><b>${name}</b><span class="pill">${w}%</span></div><div class="row"><input type="range" min="1" max="5" value="${draftScores[i]}" data-score="${i}"><strong id="score-label-${i}">${draftScores[i]}/5</strong></div></div>`).join('')}<div class="row" style="margin-top:15px"><strong id="own-score">درجتك: ${score(draftScores)}/100</strong><button class="btn" data-action="save-rating">حفظ تقييمي</button></div></div>`}}
if(page==='judge'){let mine=data.cases.filter(c=>c.judges.includes(activeJudge));h+=head('بوابة المحكم','لا تظهر إلا الملفات المسندة للمحكم');h+=`<div class="panel"><label class="field">محاكاة هوية المحكم<select id="judge-id">${opt(data.users.filter(u=>u.role==='محكم').map(u=>({value:u.id,label:u.name+' — '+u.sector})),activeJudge)}</select></label></div><div class="panel"><h3>ملفاتي (${mine.length})</h3>${mine.map(c=>`<div class="file"><div><strong>${E(c.title)}</strong><div class="muted">${E(c.name)} · ${E(c.track)}</div></div><span class="pill">${average(c)===null?'بانتظار التقييمات':average(c)+'/100'}</span></div>`).join('')||'<p class="muted">لا توجد ملفات محالة.</p>'}</div>`}
if(page==='results'){h+=head('نتائج المدير التنفيذي','درجات المقيمين الثلاثة والمتوسط الحسابي بعد اكتمالها');h+=`<div class="panel tablewrap"><table><thead><tr><th>النشاط</th><th>المقيم الأول</th><th>المقيم الثاني</th><th>المقيم الثالث</th><th>المتوسط</th></tr></thead><tbody>${data.cases.map(c=>`<tr><td>${E(c.title)}</td>${[0,1,2].map(i=>`<td>${c.assigned[i]&&c.ratings[c.assigned[i]]?score(c.ratings[c.assigned[i]]).toFixed(2):'—'}</td>`).join('')}<td><strong>${average(c)===null?'غير مكتمل':average(c).toFixed(2)}</strong></td></tr>`).join('')}</tbody></table></div><div class="warning">المتوسط = مجموع الدرجات المرجحة للمقيمين الثلاثة ÷ 3. لا يُعتمد قبل اكتمال التقييمات الثلاثة.</div>`}
if(page==='reports'){h+=head('التقارير والمؤشرات','متابعة حالات الطلبات والتقييمات وبيانات الحوكمة');h+=`<div class="stats" style="margin:16px 0">${[['الطلبات',data.cases.length],['تقييمات فردية',data.cases.reduce((s,c)=>s+rated(c).length,0)],['متوسطات مكتملة',data.cases.filter(c=>average(c)!==null).length],['درجات حوكمة مدخلة',data.cases.filter(c=>c.govScore!==''&&!c.govUnavailable).length]].map(([t,n])=>`<div class="stat"><strong>${n}</strong><span class="muted">${t}</span></div>`).join('')}</div><div class="panel"><h3>الطلبات حسب الفئة</h3>${Object.keys(sectors).map(s=>{let n=data.cases.filter(c=>c.sector===s).length;return `<div style="margin:12px 0"><div class="row mini"><span>${E(s)}</span><b>${n}</b></div><div class="progress"><div style="width:${n/Math.max(1,data.cases.length)*100}%"></div></div></div>`}).join('')}<button class="btn secondary" data-action="export">تصدير CSV</button></div>`}
$('view').innerHTML=h}
function syncAssign(){let c=caseBy(activeCase);selectedReviewers=[...(c?.assigned||[])];selectedJudges=[...(c?.judges||[])]}syncAssign();
document.addEventListener('input',e=>{let k=e.target.dataset.form;if(k&&k!=='sector'&&k!=='govYear')form[k]=e.target.value;let u=e.target.dataset.new;if(u&&u!=='role'&&u!=='sector')newUser[u]=e.target.value;if(e.target.dataset.score!==undefined){let i=+e.target.dataset.score;draftScores[i]=+e.target.value;let label=$('score-label-'+i),total=$('own-score');if(label)label.textContent=draftScores[i]+'/5';if(total)total.textContent='درجتك: '+score(draftScores)+'/100'}});
document.addEventListener('change',e=>{if(e.target.dataset.form==='sector'){form.sector=e.target.value;form.track=sectors[form.sector][0];render()}if(e.target.dataset.form==='govYear')form.govYear=e.target.value;if(e.target.name==='track'){form.track=e.target.value;render()}if(e.target.dataset.govUnavailable!==undefined){form.govUnavailable=e.target.checked;if(form.govUnavailable){form.govScore='';form.govIssuer=''}render()}if(e.target.dataset.consent!==undefined)form.consent=e.target.checked;if(e.target.dataset.new==='role')newUser.role=e.target.value;if(e.target.dataset.new==='sector')newUser.sector=e.target.value;if(e.target.id==='assign-case'){activeCase=+e.target.value;syncAssign();render()}if(e.target.dataset.pickReviewer!==undefined){let id=+e.target.dataset.pickReviewer;selectedReviewers=e.target.checked?[...new Set([...selectedReviewers,id])]:selectedReviewers.filter(x=>x!==id);render()}if(e.target.dataset.pickJudge!==undefined){let id=+e.target.dataset.pickJudge;selectedJudges=e.target.checked?[...new Set([...selectedJudges,id])]:selectedJudges.filter(x=>x!==id);render()}if(e.target.id==='reviewer-id'){activeReviewer=+e.target.value;selectedReviewCase=data.cases.find(c=>c.assigned.includes(activeReviewer))?.id||-1;loadScores();render()}if(e.target.id==='judge-id'){activeJudge=+e.target.value;render()}if(e.target.id==='pdf-files'){let rejected=[];for(let f of [...e.target.files]){if(!f.name.toLowerCase().endsWith('.pdf')||(f.type&&f.type!=='application/pdf')){rejected.push(f.name+' (الصيغة)');continue}if(f.size>10*1048576){rejected.push(f.name+' (الحجم)');continue}if(files.length>=10){rejected.push(f.name+' (العدد)');continue}if(files.some(x=>x.name===f.name&&x.size===f.size)){rejected.push(f.name+' (مكرر)');continue}files.push(f)}e.target.value='';message=rejected.length?'ملفات مرفوضة: '+rejected.join('، '):'';render()}});
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){go(n.dataset.page);return}let remove=e.target.closest('[data-remove]');if(remove){files.splice(+remove.dataset.remove,1);render();return}let preview=e.target.closest('[data-preview]');if(preview){let f=files[+preview.dataset.preview];if(f){let url=URL.createObjectURL(f);window.open(url,'_blank','noopener,noreferrer');setTimeout(()=>URL.revokeObjectURL(url),60000)}return}let rc=e.target.closest('[data-review-case]');if(rc){selectedReviewCase=+rc.dataset.reviewCase;loadScores();render();return}let a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'back':step=Math.max(0,step-1);message='';render();break;case 'next':if(step===0&&(!form.name.trim()||!form.license.trim())){flash('يرجى إدخال اسم الجهة ورقم الترخيص.');return}if(step===0&&!form.govUnavailable&&form.govScore!==''&&(!Number.isFinite(+form.govScore)||+form.govScore<0||+form.govScore>100)){flash('درجة الحوكمة يجب أن تكون بين 0 و100.');return}if(step===2&&(!form.title.trim()||!form.description.trim())){flash('يرجى إدخال عنوان الإنجاز ووصفه.');return}step++;message='';render();break;case 'submit':if(!form.consent){flash('يرجى الموافقة على الإقرار.');return}data.cases.push({...form,id:Math.max(0,...data.cases.map(c=>c.id))+1,files:files.map(f=>({name:f.name,size:f.size})),assigned:[],judges:[],ratings:{},status:'مُرسل'});persist();form=blank();files=[];step=0;go('requests');flash('تم حفظ طلب الترشح وبيانات المرفقات محلياً. محتوى ملفات PDF غير محفوظ؛ يلزم خادم لرفعه فعلياً.');break;case 'create-user':if(!newUser.name.trim()||!/^\S+@\S+\.\S+$/.test(newUser.email)){flash('يرجى إدخال الاسم والبريد الإلكتروني الصحيح.');return}if(data.users.some(u=>u.email.toLowerCase()===newUser.email.toLowerCase())){flash('البريد الإلكتروني مستخدم بالفعل.');return}data.users.push({...newUser,id:Math.max(0,...data.users.map(u=>u.id))+1});persist();newUser={name:'',email:'',role:'مقيم',sector:'جمعية أهلية'};flash('تم إنشاء حساب تجريبي؛ لا توجد بيانات دخول حقيقية.');break;case 'assign-reviewers':{let c=caseBy(activeCase);if(selectedReviewers.length!==3||new Set(selectedReviewers).size!==3){flash('يجب تعيين ثلاثة مقيمين مختلفين بالضبط.');return}if(selectedReviewers.some(id=>!data.users.some(u=>u.id===id&&u.role==='مقيم'&&u.sector===c.sector))){flash('تخصص أحد المقيمين غير مطابق.');return}if(Object.keys(c.ratings).length&&JSON.stringify(c.assigned)!==JSON.stringify(selectedReviewers)){flash('لا يمكن تغيير المقيمين بعد بدء التقييم في هذا النموذج.');return}c.assigned=[...selectedReviewers];c.status='قيد التقييم';persist();flash('تم تعيين المقيمين الثلاثة.');break}case 'assign-judges':{let c=caseBy(activeCase);if(selectedJudges.some(id=>!data.users.some(u=>u.id===id&&u.role==='محكم'&&u.sector===c.sector))){flash('لا يمكن إسناد ملف لمحكم غير مختص.');return}c.judges=[...selectedJudges];persist();flash('تم حفظ إسناد المحكمين.');break}case 'save-rating':{let c=caseBy(selectedReviewCase);if(!c||!c.assigned.includes(activeReviewer)){flash('هذا الملف غير مسند إليك.');return}c.ratings[activeReviewer]=[...draftScores];if(average(c)!==null)c.status='مكتمل التقييم';persist();flash('تم حفظ تقييمك. لن تظهر لك درجات المقيمين الآخرين.');break}case 'export':{let rows=[['رقم الطلب','الجهة','الفئة','المسار','الحوكمة','السنة','المقيم 1','المقيم 2','المقيم 3','المتوسط'],...data.cases.map(c=>[c.id,c.name,c.sector,c.track,gov(c),c.govYear,...[0,1,2].map(i=>c.assigned[i]&&c.ratings[c.assigned[i]]?score(c.ratings[c.assigned[i]]):''),average(c)??''])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='tabuk-award-report.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}});
render();})();
